name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify CI passed on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          run=$(gh run list \
            --workflow=ci.yml \
            --branch=main \
            --commit="$sha" \
            --limit=1 \
            --json status,conclusion \
            --jq '.[0] // empty | "\(.status) \(.conclusion // "")"')
          if [ -z "$run" ]; then
            echo "::error::No CI run found for main@$sha"
            exit 1
          fi
          read -r status conclusion <<< "$run"
          if [ "${status:-missing}" != "completed" ] || [ "${conclusion:-}" != "success" ]; then
            echo "::error::CI on main@$sha is '${status:-missing}/${conclusion:-}', not a completed success"
            exit 1
          fi

      - name: Compute next tag
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Only stable vX.Y.Z tags reachable from main; skip prereleases.
          tag_output=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname)
          mapfile -t tags <<< "$tag_output"
          latest=""
          for tag in "${tags[@]}"; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              latest="$tag"
              break
            fi
          done
          if [ -z "$latest" ]; then
            case "$BUMP" in
              major) next=v1.0.0 ;;
              *) next=v0.1.0 ;;
            esac
          else
            v=${latest#v}
            IFS=. read -r MA MI PA <<< "$v"
            case "$BUMP" in
              major) next="v$((MA + 1)).0.0" ;;
              minor) next="v$MA.$((MI + 1)).0" ;;
              patch) next="v$MA.$MI.$((PA + 1))" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Tag $next already exists"
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next (previous: ${latest:-none})"

      - name: Create tag
        env:
          NEXT_TAG: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"

      - name: Create GitHub Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.next.outputs.next }}
        run: gh release create "$NEXT_TAG" --generate-notes --title "$NEXT_TAG"

      - name: Remove tag after failed release
        if: failure() && steps.next.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          if gh release view "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Release $NEXT_TAG exists; keeping the tag."
            exit 0
          fi
          git push origin --delete "$NEXT_TAG" || true
