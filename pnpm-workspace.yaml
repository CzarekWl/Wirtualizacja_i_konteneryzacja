packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@eslint/js": ^10.0.1
  "@types/node": ^22.20.5
  "@vitest/coverage-v8": ^5.1.1
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.14.0
  prettier: ^3.10.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  typescript-eslint: ^8.73.0
  vitest: ^5.1.1

engineStrict: true

allowBuilds:
  esbuild: true

minimumReleaseAge: 4320 # 3 days (or 20160 for 2 weeks)
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0

audit:
  level: high
  ignore: []
